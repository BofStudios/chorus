<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self';"
    />
    <title>Chorus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Drag strip under the native window controls; nothing sits on top of it. -->
    <div class="titlebar"></div>

    <div class="shell">
      <aside class="rail" id="rail">
        <div class="rail-brand">
          <img class="brand-mark" src="logo.svg" alt="" />
          <div class="rail-label brand-text">
            <div class="brand-name">Chorus</div>
            <div class="brand-sub">outreach research</div>
          </div>
        </div>

        <nav id="nav">
          <button class="nav-item" data-view="new" title="New research">
            <span class="nav-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="9" cy="9" r="5.5" />
                <path d="M13.2 13.2 17 17" stroke-linecap="round" />
              </svg>
            </span>
            <span class="rail-label">New research</span>
          </button>

          <button class="nav-item" data-view="targets" title="Results">
            <span class="nav-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8" stroke-linecap="round" />
              </svg>
            </span>
            <span class="rail-label">Results</span>
          </button>

          <button class="nav-item" data-view="watchlist" title="Watchlist">
            <span class="nav-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M5.5 3.5h9v13l-4.5-3.2-4.5 3.2z" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="rail-label">Watchlist</span>
            <span class="badge" id="watch-badge" hidden></span>
          </button>

          <button class="nav-item" data-view="campaigns" title="History">
            <span class="nav-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="10" cy="10" r="7" />
                <path d="M10 6v4.3l2.8 1.7" stroke-linecap="round" />
              </svg>
            </span>
            <span class="rail-label">History</span>
          </button>

          <button class="nav-item" data-view="settings" title="Settings">
            <span class="nav-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="10" cy="10" r="2.6" />
                <path
                  d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2 4.8 4.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="rail-label">Settings</span>
          </button>
        </nav>

        <div class="rail-foot">
          <div class="foot-row">
            <span class="foot-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M10 10.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                <path d="M4 16.2c.9-2.3 3.2-3.4 6-3.4s5.1 1.1 6 3.4" stroke-linecap="round" />
              </svg>
            </span>
            <span class="rail-label foot-text"
              >Contacted <b id="stat-total">—</b></span
            >
          </div>
          <div class="foot-row">
            <span class="foot-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 10.5 7.5 15 17 5.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="rail-label foot-text">Today <b id="stat-today">—</b></span>
          </div>
          <div class="foot-row">
            <span class="foot-icon">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 15V9M7.7 15V5M12.3 15v-7M17 15v-4" stroke-linecap="round" />
              </svg>
            </span>
            <span class="rail-label foot-text">API <b id="stat-rate">—</b></span>
          </div>
          <div class="rail-label foot-provider" id="stat-provider">—</div>
        </div>
      </aside>

      <main class="content" id="content"></main>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
